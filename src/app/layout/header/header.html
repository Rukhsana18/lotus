<header class="site-header" [class.casino-header]="isCasinoRoute()" [class.menu-open]="mobileMenuOpen">
    <!-- Mobile Back Chevron Icon -->
    <button class="back-button" type="button" aria-label="Go back" (click)="goBack()">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </button>

    <a class="brand" routerLink="/home" aria-label="Lotus home">
        <img src="../../../assets/logo.svg" height="30" alt="LOTUS">
    </a>

    <nav class="primary-nav" aria-label="Main navigation">
        <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="nav-icon icon icon-sports-home-solid" aria-hidden="true"></i> Home
        </a>
        <a routerLink="/sports" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="nav-icon icon icon-footer-sport" aria-hidden="true"></i> Sports
        </a>
        <a routerLink="/casino" routerLinkActive="active" [class.active]="isCasinoRoute()" ariaCurrentWhenActive="page">
            <i class="nav-icon icon icon-footer-casino" aria-hidden="true"></i> Casino
        </a>
    </nav>

    <div class="header-actions">
        <time>{{ currentTime() | date: 'MMM d, yyyy' }} &nbsp; {{ currentTime() | date: 'HH:mm:ss' }}</time>
        <div class="border-1"></div>
        <a class="search-button" routerLink="/search" [queryParams]="isCasinoRoute() ? { mode: 'casino' } : null"
            aria-label="Search">
            <i class="icon icon-search-new" aria-hidden="true"></i>
        </a>
        <button class="login-button" type="button" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
    </div>
</header>

<app-login-modal />

<!-- Header Sports Menu Carousel Bar (Mobile Only) -->
@if (!isCasinoRoute()) {
    <div class="mobile-sports-carousel-wrapper">
        <nav class="mobile-sports-subnav" aria-label="Sports menu slider">
            @for (category of sportsCategories; track category.id) {
            <a class="subnav-item" [class.active]="category.id === 'cricket' && isSportsRoute()"
                [routerLink]="category.route">
                <i class="icon {{ category.icon }} side-icon" aria-hidden="true"></i>
                <span>{{ category.title }}</span>
            </a>
            }
        </nav>
    </div>
}
