<div 
  class="modal fade login-modal" 
  id="loginModal" 
  tabindex="-1" 
  aria-labelledby="loginModalLabel" 
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content login-card">
      
      <!-- Close Button -->
      <button 
        type="button" 
        class="close-btn" 
        data-bs-dismiss="modal" 
        aria-label="Close"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="modal-body text-center">
        <!-- Lotus Brand Logo -->
        <div class="brand-logo">
            <img src="../../../assets/logo.svg" alt="" height="50">
          
        </div>

        <!-- Login Form -->
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
          <!-- Username Input -->
          <div class="input-group mb-3">
            <input 
              type="text" 
              class="form-control custom-input" 
              placeholder="Username" 
              [(ngModel)]="username" 
              name="username" 
              required
            >
          </div>

          <!-- Password Input -->
          <div class="input-group mb-4 position-relative">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              class="form-control custom-input pe-5" 
              placeholder="Password" 
              [(ngModel)]="password" 
              name="password" 
              required
            >
            <button 
              type="button" 
              class="eye-toggle-btn" 
              (click)="togglePasswordVisibility()" 
              aria-label="Toggle password view"
            >
              <i class="fa-solid" [class.fa-eye]="showPassword" [class.fa-eye-slash]="!showPassword"></i>
            </button>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn login-submit-btn w-100">
            Login
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
