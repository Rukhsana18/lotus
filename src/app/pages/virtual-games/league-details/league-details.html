<div class="virtual-league-layout">
  <!-- Center Main Stream -->
  <div class="virtual-league-page">
    <header class="detail-header">
      <div class="top-bar">
        <button type="button" class="back-btn" (click)="goBack()" aria-label="Go back">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="breadcrumb">
          <span class="sport" [routerLink]="['/virtual']">Cricket</span>
          <span class="sep">/</span>
          <span class="current">{{ leagueTitle }}</span>
        </div>
      </div>
    </header>

    <main class="content-feed">
      <div class="fixture-card">
        <div class="fixture-header" (click)="toggleAccordion()">
          <div class="header-title">
            <span class="live-badge">LIVE <i class="fa-solid fa-bolt"></i></span>
            <span class="title-text">Fixtures 20th Oct</span>
          </div>
          <i class="fa-solid" [class.fa-chevron-up]="isExpanded" [class.fa-chevron-down]="!isExpanded"></i>
        </div>

        @if (isExpanded) {
          <div class="fixture-body">
            <div class="market-labels">
              <span>1</span>
              <span>2</span>
            </div>

            @for (match of matches; track match.id) {
              <div class="match-item-wrapper">
                <div class="match-row">
                  <div class="teams-col">
                    <div class="team-row">
                      <span class="status-dot"></span>
                      <i class="fa-solid fa-pencil edit-icon"></i>
                      <span class="team-name">{{ match.team1 }}</span>
                      <span class="team-score">{{ match.team1Score }}</span>
                    </div>
                    <div class="team-row">
                      <i class="fa-solid fa-pencil edit-icon"></i>
                      <span class="team-name">{{ match.team2 }}</span>
                      <span class="team-overs">{{ match.overs }}</span>
                    </div>
                  </div>

                  @if (!match.showMoreMarkets) {
                    <div class="odds-grid">
                      <button class="cell back-cell">{{ match.odds.back1 }}</button>
                      <button class="cell lay-cell">{{ match.odds.lay1 }}</button>
                      <button class="cell back-cell">{{ match.odds.back2 }}</button>
                      <button class="cell lay-cell">{{ match.odds.lay2 }}</button>
                    </div>
                  } @else {
                    <div class="expanded-markets-container">
                      <a
                        class="more-markets-btn"
                        [routerLink]="['/virtual', virtualId, 'match', match.id]"
                        aria-label="Open match details"
                      >
                        More Markets <i class="fa-solid fa-chevron-right"></i>
                      </a>
                    </div>
                  }

                  <a
                    class="extra-count-btn"
                    [routerLink]="['/virtual', virtualId, 'match', match.id]"
                    aria-label="Open match details"
                  >
                    +{{ match.extraMarketsCount }} <i class="fa-solid fa-chevron-right"></i>
                  </a>
                </div>
              </div>
            }
          </div>
        }
      </div>

      <app-footer />
    </main>
  </div>

  <!-- Right Fixed Betslip -->
  <aside class="sports-betslip">
    <app-betslip />
  </aside>
</div>
